[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-warden-ir"
version = "1.0.0"
description = "Zero-dependency DevSecOps & Incident-Response toolkit for Shannon entropy secret detection, Git commit-graph forensics, Levenshtein supply-chain auditing, and Python AST static taint analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "1MEshh", email = "152591660+1MEshh@users.noreply.github.com"}
]
keywords = ["security", "devsecops", "incident-response", "secrets-detection", "supply-chain", "ast-analysis", "sarif"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
vault-warden = "vault_warden.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vault_warden*"]

[project.urls]
Homepage = "https://github.com/1MEshh/Warden"
Repository = "https://github.com/1MEshh/Warden"
